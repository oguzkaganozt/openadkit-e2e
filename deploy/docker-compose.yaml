# VP plans → adapter → SI follows → CARLA.
# VP steering_cmd is not wired to CARLA.
#
#   ./run-loop.sh

# Lifecycle is owned by run-loop.sh, not Docker: every attempt tears the
# whole project down and recreates every container (including CARLA).
# restart: on-failure is deliberately disabled on every service — a
# self-resurrected CARLA client (scenario load_world or a bridge
# re-listen) across another client's wipe leaves the 0.9.16 server
# pumping requests for dead streams until its RPC starves (observed
# 2026-09-25, twice).
# Keep a full run's evidence: verbose nodes (adapter xfer, SI 30 Hz)
# otherwise rotate away mid-campaign. ~10x a night run per service.
x-logging: &run-logging
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "3"

services:
  carla:
    image: ${CARLA_IMAGE:?Use --env-file config.env}
    container_name: openadkit-e2e-carla
    <<: *run-logging
    network_mode: host
    init: true
    ipc: host
    runtime: ${CARLA_RUNTIME:-nvidia}
    environment:
      - DISPLAY=${DISPLAY}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    command: >
      bash CarlaUE4.sh -nosound
      -RenderOffScreen
      -carla-rpc-port=2000
    restart: "no"

  adapter:
    profiles: ["vp"]
    image: ${ADAPTER_IMAGE:-openadkit-e2e-adapter:latest}
    container_name: openadkit-e2e-adapter
    <<: *run-logging
    network_mode: host
    ipc: host
    env_file:
      - config.env
    volumes:
      - ../adapter:/opt/adapter:ro
      - ./config/cyclonedds.xml:/autoware/cyclonedds.xml:ro
    working_dir: /opt/adapter
    command: >
      bash -lc "source /opt/ros/$${ROS_DISTRO}/setup.bash &&
      source /opt/autoware/setup.bash &&
      python3 /opt/adapter/path_to_trajectory.py"
    restart: "no"

  operation-mode:
    image: ${AUTOWARE_IMAGE:?Use --env-file config.env}
    container_name: openadkit-e2e-operation-mode
    <<: *run-logging
    network_mode: host
    ipc: host
    env_file:
      - config.env
    volumes:
      - ./nodes:/opt/nodes:ro
      - ./config/cyclonedds.xml:/autoware/cyclonedds.xml:ro
    command: >
      bash -lc "source /opt/ros/$${ROS_DISTRO}/setup.bash &&
      source /opt/autoware/setup.bash &&
      python3 /opt/nodes/operation_mode.py"
    restart: "no"

  carla-bridge:
    image: ${AUTOWARE_IMAGE:?Use --env-file config.env}
    container_name: openadkit-e2e-carla-bridge
    <<: *run-logging
    network_mode: host
    ipc: host
    env_file:
      - config.env
    volumes:
      - ./nodes:/opt/nodes:ro
      - ./config/cyclonedds.xml:/autoware/cyclonedds.xml:ro
      - /tmp/snaps:/tmp/snaps:rw
      - /tmp/carla-0.9.16-cp310-cp310-manylinux_2_31_x86_64.whl:/opt/carla-0.9.16-cp310-cp310-manylinux_2_31_x86_64.whl:ro
    command: >
      bash -lc "source /opt/ros/$${ROS_DISTRO}/setup.bash &&
      source /opt/autoware/setup.bash &&
      python3 -c 'import carla,numpy' 2>/dev/null ||
      pip3 install /opt/carla-0.9.16-cp310-cp310-manylinux_2_31_x86_64.whl numpy &&
      python3 /opt/nodes/carla_bridge.py"
    depends_on:
      - carla
    restart: "no"

  # E2E #2: the only process that writes CARLA vehicle controls. It consumes
  # the SI's ApprovedRequest directly on domain 2 (no bridge hop) and has no
  # watchdog brake, speed target or latch of its own; SI owns every stop
  # decision. The telemetry bridge above never calls apply_control().
  carla-actuator:
    image: ${ADAPTER_IMAGE:-openadkit-e2e-adapter:latest}
    container_name: openadkit-e2e-carla-actuator
    <<: *run-logging
    network_mode: host
    ipc: host
    env_file:
      - config.env
    environment:
      - ROS_DOMAIN_ID=2
    volumes:
      - ./nodes:/opt/nodes:ro
      - ./config/cyclonedds.xml:/autoware/cyclonedds.xml:ro
      - /tmp/carla-0.9.16-cp310-cp310-manylinux_2_31_x86_64.whl:/opt/carla-0.9.16-cp310-cp310-manylinux_2_31_x86_64.whl:ro
    command: >
      bash -lc "source /opt/ros/$${ROS_DISTRO}/setup.bash &&
      source /opt/autoware/setup.bash &&
      python3 -c 'import carla' 2>/dev/null ||
      pip3 install /opt/carla-0.9.16-cp310-cp310-manylinux_2_31_x86_64.whl &&
      exec python3 /opt/nodes/carla_actuator.py"
    depends_on:
      - carla
    restart: "no"

  domain-bridge:
    image: ${BRIDGE_IMAGE:-openadkit-e2e-domain-bridge:latest}
    container_name: openadkit-e2e-bridge
    <<: *run-logging
    network_mode: host
    ipc: host
    env_file:
      - config.env
    volumes:
      - ./config/cyclonedds.xml:/autoware/cyclonedds.xml:ro
      - ./config/bridge-config.yaml:/autoware/bridge-config.yaml:ro
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - >-
        source "/opt/ros/$${ROS_DISTRO}/setup.bash" &&
        source "/opt/autoware/setup.bash" &&
        exec ros2 run domain_bridge domain_bridge
        --wait-for-publisher false /autoware/bridge-config.yaml
    restart: "no"

  visionpilot:
    profiles: ["vp"]
    image: ${VISIONPILOT_IMAGE:?Use --env-file config.env}
    container_name: openadkit-e2e-visionpilot
    <<: *run-logging
    network_mode: host
    ipc: host
    runtime: ${VISIONPILOT_RUNTIME:-nvidia}
    environment:
      - DISPLAY=${DISPLAY}
      - LIBGL_ALWAYS_SOFTWARE=1
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./config/${VISIONPILOT_CONF:-vision_pilot.conf}:/usr/share/visionpilot/config/vision_pilot.conf:ro
      - ./config/vision_pilot.carla.conf:/usr/share/visionpilot/config/vision_pilot_ros2.conf:ro
      - ./config/H.yaml:/usr/share/visionpilot/config/H.yaml:ro
      # C must be generated from the SAME H (deploy/tools/gen-homography-c.sh).
      # The image's built-in C comes from the in-tree example H and would warp
      # AutoDrive's input with a mismatched calibration.
      - ./config/homography_C_matrix.yaml:/usr/share/visionpilot/config/homography_C_matrix.yaml:ro
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - source /opt/ros/jazzy/setup.bash && exec /usr/bin/VisionPilot --no-window
    restart: "no"

  # Autoware supplies a Lanelet2 route and trajectory, never vehicle/control
  # output. CARLA ground truth and /clock come from carla-bridge (domain 1).
  autoware-planning:
    profiles: ["autoware"]
    image: ${AUTOWARE_IMAGE:?Use --env-file config.env}
    container_name: openadkit-e2e-autoware-planning
    <<: *run-logging
    network_mode: host
    ipc: host
    env_file:
      - config.env
    volumes:
      - ./autoware:/opt/rig-autoware:ro
      - ./maps/town04:/opt/maps/town04:ro
      - ./config/cyclonedds.xml:/autoware/cyclonedds.xml:ro
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - >-
        source /opt/ros/$${ROS_DISTRO}/setup.bash &&
        source /opt/autoware/setup.bash &&
        exec ros2 launch /opt/rig-autoware/planning_only.launch.xml
        map_path:=/opt/maps/town04
    restart: "no"

  odom-to-tf:
    profiles: ["autoware"]
    image: ${AUTOWARE_IMAGE:?Use --env-file config.env}
    container_name: openadkit-e2e-odom-to-tf
    <<: *run-logging
    network_mode: host
    ipc: host
    env_file:
      - config.env
    volumes:
      - ./nodes:/opt/nodes:ro
      - ./config/cyclonedds.xml:/autoware/cyclonedds.xml:ro
    command: >
      bash -lc "source /opt/ros/$${ROS_DISTRO}/setup.bash &&
      source /opt/autoware/setup.bash &&
      exec python3 /opt/nodes/odom_to_tf.py"
    depends_on:
      - carla-bridge
    restart: "no"

  # Planning needs an explicit objects sample even in a lead-free world.
  # This fixture refuses to start for a scenario with NPCs or a lead vehicle.
  empty-scene:
    profiles: ["autoware"]
    image: ${AUTOWARE_IMAGE:?Use --env-file config.env}
    container_name: openadkit-e2e-empty-scene
    <<: *run-logging
    network_mode: host
    ipc: host
    env_file:
      - config.env
    volumes:
      - ./nodes:/opt/nodes:ro
      - ./config/${RIG_JSON:-carla-rig-empty.json}:/opt/config/carla-rig.json:ro
      - ./config/cyclonedds.xml:/autoware/cyclonedds.xml:ro
    command: >
      bash -lc "source /opt/ros/$${ROS_DISTRO}/setup.bash &&
      source /opt/autoware/setup.bash &&
      exec python3 /opt/nodes/empty_scene.py"
    depends_on:
      - carla-bridge
    restart: "no"

  scenario:
    image: ${AUTOWARE_IMAGE:?Use --env-file config.env}
    container_name: openadkit-e2e-scenario
    <<: *run-logging
    network_mode: host
    ipc: host
    init: true
    environment:
      - SPAWN_INDEX=${SPAWN_INDEX:-184}
    volumes:
      - ./nodes/scenario.py:/opt/nodes/scenario.py:ro
      - ./config/${RIG_JSON:-carla-rig.json}:/opt/config/carla-rig.json:ro
      - /tmp/carla-0.9.16-cp310-cp310-manylinux_2_31_x86_64.whl:/opt/carla-0.9.16-cp310-cp310-manylinux_2_31_x86_64.whl:ro
    command: >
      bash -lc "python3 -c 'import carla' 2>/dev/null ||
      pip3 install /opt/carla-0.9.16-cp310-cp310-manylinux_2_31_x86_64.whl &&
      python3 /opt/nodes/scenario.py --host 127.0.0.1 --port 2000 -f /opt/config/carla-rig.json"
    depends_on:
      - carla
    restart: "no"

  si:
    image: ${AUTOWARE_IMAGE:?Use --env-file config.env}
    container_name: openadkit-e2e-si
    <<: *run-logging
    network_mode: host
    ipc: host
    init: true
    environment:
      # Startup-only selection. Missing values cause SI to fail closed.
      - SI_SUPERVISION_MODE=${SI_MODE:-}
      - SI_TRAJECTORY_SOURCE=${RIG_MODE:-}
    volumes:
      - ../upstream/autoware-safety-island/build/freertos-posix/actuation_freertos:/opt/si/actuation_freertos:ro
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - exec /opt/si/actuation_freertos
    depends_on:
      - domain-bridge
      - carla-bridge
    restart: "no"
