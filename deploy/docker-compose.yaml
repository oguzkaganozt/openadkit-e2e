# VP plans → adapter → SI follows → CARLA.
# VP steering_cmd is not wired to CARLA.
#
#   ./run-loop.sh

services:
  carla:
    image: ${CARLA_IMAGE:?Use --env-file config.env}
    container_name: openadkit-e2e-carla
    network_mode: host
    init: true
    ipc: host
    runtime: nvidia
    environment:
      - DISPLAY=${DISPLAY}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    command: >
      bash CarlaUE4.sh -nosound
      -RenderOffScreen
      -carla-rpc-port=2000
    restart: on-failure

  adapter:
    image: ${AUTOWARE_IMAGE:?Use --env-file config.env}
    container_name: openadkit-e2e-adapter
    network_mode: host
    ipc: host
    env_file:
      - config.env
    volumes:
      - ../adapter:/opt/adapter:ro
      - ./config/cyclonedds.xml:/autoware/cyclonedds.xml:ro
    working_dir: /opt/adapter
    command: >
      bash -lc "source /opt/ros/$${ROS_DISTRO}/setup.bash &&
      source /opt/autoware/setup.bash &&
      python3 /opt/adapter/path_to_trajectory.py --ros-args -p input_path_topic:=/vehicle/lane_path_relay"
    restart: on-failure

  operation-mode:
    image: ${AUTOWARE_IMAGE:?Use --env-file config.env}
    container_name: openadkit-e2e-operation-mode
    network_mode: host
    ipc: host
    env_file:
      - config.env
    volumes:
      - ./nodes:/opt/nodes:ro
      - ./config/cyclonedds.xml:/autoware/cyclonedds.xml:ro
    command: >
      bash -lc "source /opt/ros/$${ROS_DISTRO}/setup.bash &&
      source /opt/autoware/setup.bash &&
      python3 /opt/nodes/operation_mode.py"
    restart: on-failure

  carla-bridge:
    image: ${AUTOWARE_IMAGE:?Use --env-file config.env}
    container_name: openadkit-e2e-carla-bridge
    network_mode: host
    ipc: host
    env_file:
      - config.env
    volumes:
      - ./nodes:/opt/nodes:ro
      - ./config/cyclonedds.xml:/autoware/cyclonedds.xml:ro
      - /tmp/carla-0.9.16-cp310-cp310-manylinux_2_31_x86_64.whl:/opt/carla-0.9.16-cp310-cp310-manylinux_2_31_x86_64.whl:ro
    command: >
      bash -lc "source /opt/ros/$${ROS_DISTRO}/setup.bash &&
      source /opt/autoware/setup.bash &&
      python3 -c 'import carla,numpy' 2>/dev/null ||
      pip3 install /opt/carla-0.9.16-cp310-cp310-manylinux_2_31_x86_64.whl numpy &&
      python3 /opt/nodes/carla_bridge.py"
    depends_on:
      - carla
    restart: on-failure

  domain-bridge:
    build:
      context: ../upstream/autoware-safety-island/demo/bridge
      args:
        ROS_DISTRO: humble
    container_name: openadkit-e2e-bridge
    network_mode: host
    ipc: host
    env_file:
      - config.env
    volumes:
      - ./config/cyclonedds.xml:/autoware/cyclonedds.xml:ro
      - ./config/bridge-config.yaml:/autoware/bridge-config.yaml:ro
    restart: on-failure

  visionpilot:
    profiles: ["vp"]
    image: ${VISIONPILOT_IMAGE:-visionpilot:gpu-ros2}
    container_name: openadkit-e2e-visionpilot
    network_mode: host
    ipc: host
    runtime: nvidia
    environment:
      - DISPLAY=${DISPLAY}
      - LIBGL_ALWAYS_SOFTWARE=1
      - QT_X11_NO_MITSHM=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - ROS_DOMAIN_ID=1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./config/cyclonedds.xml:/autoware/cyclonedds.xml:ro
      - ./config/vision_pilot.conf:/usr/share/visionpilot/config/vision_pilot.conf:ro
      - ./config/vision_pilot.carla.conf:/usr/share/visionpilot/config/vision_pilot_ros2.conf:ro
      - ./config/H.yaml:/usr/share/visionpilot/config/H.yaml:ro
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - source /opt/ros/jazzy/setup.bash && exec /usr/bin/VisionPilot --no-window
    restart: on-failure

  path-tx:
    profiles: ["vp"]
    image: ${VISIONPILOT_IMAGE:-visionpilot:gpu-ros2}
    container_name: openadkit-e2e-path-tx
    network_mode: host
    ipc: host
    environment:
      - ROS_DOMAIN_ID=1
    volumes:
      - ./nodes:/opt/nodes:ro
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - source /opt/ros/jazzy/setup.bash && python3 /opt/nodes/path_relay_tx.py
    restart: on-failure

  path-rx:
    image: ${AUTOWARE_IMAGE:?Use --env-file config.env}
    container_name: openadkit-e2e-path-rx
    network_mode: host
    ipc: host
    env_file:
      - config.env
    volumes:
      - ./nodes:/opt/nodes:ro
      - ./config/cyclonedds.xml:/autoware/cyclonedds.xml:ro
    command: >
      bash -lc "source /opt/ros/$${ROS_DISTRO}/setup.bash &&
      source /opt/autoware/setup.bash &&
      python3 /opt/nodes/path_relay_rx.py"
    restart: on-failure

  scenario:
    image: ${AUTOWARE_IMAGE:?Use --env-file config.env}
    container_name: openadkit-e2e-scenario
    network_mode: host
    ipc: host
    init: true
    environment:
      - SPAWN_INDEX=${SPAWN_INDEX:-184}
    volumes:
      - ./nodes/scenario.py:/opt/nodes/scenario.py:ro
      - ./config/carla-rig.json:/opt/config/carla-rig.json:ro
      - /tmp/carla-0.9.16-cp310-cp310-manylinux_2_31_x86_64.whl:/opt/carla-0.9.16-cp310-cp310-manylinux_2_31_x86_64.whl:ro
    command: >
      bash -lc "python3 -c 'import carla' 2>/dev/null ||
      pip3 install /opt/carla-0.9.16-cp310-cp310-manylinux_2_31_x86_64.whl &&
      python3 /opt/nodes/scenario.py --host 127.0.0.1 --port 2000 -f /opt/config/carla-rig.json"
    depends_on:
      - carla
    restart: on-failure

  si:
    image: ${AUTOWARE_IMAGE:?Use --env-file config.env}
    container_name: openadkit-e2e-si
    network_mode: host
    ipc: host
    init: true
    volumes:
      - ../upstream/autoware-safety-island/build/freertos-posix/actuation_freertos:/opt/si/actuation_freertos:ro
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - exec /opt/si/actuation_freertos
    depends_on:
      - domain-bridge
      - carla-bridge
      - adapter
    restart: on-failure
