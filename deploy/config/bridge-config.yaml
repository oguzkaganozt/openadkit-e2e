name: safety_island_bridge
topics:
  vehicle/driving_command:
    type: visionpilot_msgs/msg/DrivingCommand
    from_domain: 1
    to_domain: 2
  vehicle/status/steering_status:
    type: autoware_vehicle_msgs/msg/SteeringReport
    from_domain: 1
    to_domain: 2
  planning/scenario_planning/trajectory:
    type: autoware_planning_msgs/msg/Trajectory
    from_domain: 1
    to_domain: 2
  vehicle/driving_reference:
    type: visionpilot_msgs/msg/DrivingReference
    from_domain: 1
    to_domain: 2
  system/operation_mode/state:
    type: autoware_adapi_v1_msgs/msg/OperationModeState
    from_domain: 1
    to_domain: 2
    # The SI's operation-mode reader requests TRANSIENT_LOCAL by default so a
    # late-joining SI still receives the on-change state. Retain the last
    # value on both sides: a VOLATILE bridge writer would not match a
    # TRANSIENT_LOCAL reader at all.
    qos:
      reliability: reliable
      durability: transient_local
      history: keep_last
      depth: 1
  localization/kinematic_state:
    type: nav_msgs/msg/Odometry
    from_domain: 1
    to_domain: 2
  localization/acceleration:
    type: geometry_msgs/msg/AccelWithCovarianceStamped
    from_domain: 1
    to_domain: 2
