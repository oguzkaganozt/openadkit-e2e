source.mode             = ros2

source.v4l2_device      = /dev/video0
source.v4l2_fps         = 10

engine.provider     = cuda
engine.device_id    = 0
engine.cache_dir    = /tmp/visionpilot_trt_cache
engine.workspace_gb = 1.0

model.precision    = fp32

# Per-frame fusion logs (AD prob / AS bbox+dist per confirm) to diagnose
# close-range CIPO blindness. Verbose; test rig only.
fusion.debug = true

speed_limit = 9.0
L                = 2.860

# Rig viewer config, used with VISIONPILOT_IMAGE=visionpilot:gpu-ros2-view:
# render the HUD and serve it as MJPEG on webrtc_port (/view page, /mjpeg
# stream) so it can be watched through an HTTP tunnel. No driving logic is
# affected; the default config keeps visualization off.
visualization_on = true

webrtc_on = true
webrtc_port = 8080

rrd_on  = false
rrd_log = visionpilot.rrd

# P1 A/B (needs VISIONPILOT_IMAGE=visionpilot:gpu-ros2-diag, which reads
# fusion.lat.*): the lateral particle filter lagged the raw camera CTE by
# ~7 cycles (~0.7 s) at 9 m/s on spawn 184. Let the CV model move faster and
# trust the measurement more; everything else equals vision_pilot.diag9.conf.
fusion.lat.proc_noise_cte_rate_mps = 0.60
fusion.lat.proc_noise_yaw_rate_rps = 0.20
fusion.lat.meas_noise_cte_m        = 0.08
