source.mode             = ros2

source.v4l2_device      = /dev/video0
source.v4l2_fps         = 10

engine.provider     = cuda
engine.device_id    = 0
engine.cache_dir    = /tmp/visionpilot_trt_cache
engine.workspace_gb = 1.0

model.precision    = fp32

# Identical driving/viewing settings to vision_pilot.demo.conf, without the
# verbose per-frame fusion logs. Used to diagnose whether logging overhead
# contributes to rare >1 s VP inference gaps in SI_CONTROL.
fusion.debug = false
speed_limit  = 4.0
L            = 2.860

visualization_on = true
webrtc_on = true
webrtc_port = 8080

rrd_on  = false
rrd_log = visionpilot.rrd
