source.mode             = ros2

source.v4l2_device      = /dev/video0
source.v4l2_fps         = 10

engine.provider     = cuda
engine.device_id    = 0
engine.cache_dir    = /tmp/visionpilot_trt_cache
engine.workspace_gb = 1.0

model.precision    = fp32

# Deliberately cap the demo's VP-selected target speed at the CES prototype's
# 4 m/s operating point. The default 33.3 m/s config is not changed; this
# low-speed comparison is not a high-speed lateral-controller fix.
fusion.debug = true
speed_limit  = 4.0
L            = 2.860

# The demo image includes the optional HTTP viewer for VP's rendered HUD.
visualization_on = true
webrtc_on = true
webrtc_port = 8080

rrd_on  = false
rrd_log = visionpilot.rrd

# Lateral fusion tuned for the CARLA rig (finding 013): the default filter
# lagged the raw camera CTE by ~0.7 s at 9 m/s and the car weaved into the
# guardrail. Needs a VP build with fusion.lat.* (fork fix/vp-lat-fusion-config).
fusion.lat.proc_noise_cte_rate_mps = 0.60
fusion.lat.proc_noise_yaw_rate_rps = 0.20
fusion.lat.meas_noise_cte_m        = 0.08
